# 確認:push と PR で、AGENTS.md の「確認方法」と同じことを3つの OS で流す。
# 手元(Windows)で通っても、ほかの OS のビルドとテストが落ちていないかをここで知る。
name: CI

on:
  push:
    branches: [ main, features ]
  pull_request:

jobs:

  check:

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows は C コンパイラなし(CGO_ENABLED=0)で通ることを確かめる(AGENTS.md の技術方針)
          - os: windows-latest
            cgo: '0'
          # Linux と macOS の Wails は GTK / Cocoa を cgo で呼ぶので、画面のアプリには cgo が要る。
          # Linux は対応をうたう最古のディストリに固定する(ubuntu-latest は glibc が新しすぎる。wails3 スキルの pitfalls 16)
          - os: ubuntu-24.04
            cgo: '1'
          - os: macos-latest
            cgo: '1'
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: ${{ matrix.cgo }}

    steps:

      # Windows のランナーは core.autocrlf=true で、checkout すると .go が CRLF になり gofmt -l に全部出る。
      # 手元と同じ LF のまま取ってくる
      - name: Keep LF on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Load variables
        # matrix に Windows が入るので shell: bash が要る(既定の pwsh では $GITHUB_ENV に書けず、WAILS_VERSION が空になる)
        shell: bash
        run: cat .github/variables >> $GITHUB_ENV

      - name: Install Wails CLI
        # .github/variables で固定した版を使う(@latest は使わない)
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: gofmt
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt が必要なファイルがあります:"
            echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet ./... ./_cmd/aibow ./_cmd/aibow-mcp ./_cmd/aibow-server

      - name: go test
        run: go test ./...

      - name: go test (desktop app)
        # 別モジュールなので ./... に入らない
        working-directory: ./_cmd/aibow
        run: go test .

      - name: wails3 build
        # バインディング生成 → 画面の型チェックとビルド(web/dist/app)→ Go のビルド
        working-directory: ./_cmd/aibow
        run: wails3 build

      - name: Build aibow-server and aibow-mcp
        # aibow-server は上で作った画面を埋め込む。どの OS も C コンパイラなしで作る
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: go build -o "$RUNNER_TEMP/" ./_cmd/aibow-server ./_cmd/aibow-mcp
