# 個人用のタスク(ローカルデプロイ)のひな形。
#
# Taskfile.local.yml という名前でコピーして使う(Taskfile.local.yml は Git に入れない)。
# コピー先などの ★ の値は、自分の環境に合わせて書き換える。
#
#   wails3 task local:deploy                                   # ビルドして既定の場所へインストール
#   wails3 task local:deploy DEPLOY_DEST="D:/tmp/aibow"        # インストール先を指定
#   wails3 task local:build-info                               # バージョンとアプリ情報の反映だけ
#
# local:deploy は次の順に動く:
#
#   1. 起動中の aibow を終了する(起動中の exe は上書きできないため)
#   2. v+今のバージョンのタグがあれば(= デプロイ済みなのに version を上げていなければ)patch を上げる
#   3. version の値を config.yml / package.json / package-lock.json と、exe に焼き込むバージョン情報(build/windows/info.json など)に反映する
#   4. wails3 build
#   5. 3 で変わったファイルだけをコミットする(作業中の他の変更は巻き込まない)
#   6. HEAD に v+バージョンのタグを打つ(push はしない)
#   7. bin/aibow.exe と lib(llama.cpp の DLL)をインストール先へコピーする
#
# マイナー・メジャーを上げるときは、先に go run _cmd/version.go -bump(リポジトリのルートで)で version を書き換えてから deploy する。
version: '3'

vars:
  DEPLOY_DEST: '{{.DEPLOY_DEST | default "D:/Program Files/aibow"}}'   # ★ インストール先
  # インストール先へコピーする llama.cpp の DLL。worktree など lib が無い場所では本体の lib を指定する
  LIB_SRC: '{{.LIB_SRC | default "lib"}}'                              # ★
  # build-info と wails3 build が書き換える Git 管理下のファイル(_cmd/aibow からの相対パス)
  BUILD_INFO_FILES: >-
    version
    build/config.yml
    build/darwin/Info.plist
    build/darwin/Info.dev.plist
    build/darwin/icons.icns
    build/linux/desktop
    build/linux/nfpm/nfpm.yaml
    build/windows/info.json
    build/windows/icon.ico
    build/windows/nsis/wails_tools.nsh
    build/windows/wails.exe.manifest
    frontend/package.json
    frontend/package-lock.json

tasks:
  deploy:
    desc: Build and install aibow locally.
    preconditions:
      - sh: test -d "{{.LIB_SRC}}"
        msg: "llama.cpp の DLL のフォルダ {{.LIB_SRC}} がありません。LIB_SRC=<lib のパス> で指定してください"
    cmds:
      # 起動中の exe は上書きできないので先に終了させる。
      # 起動していないと Get-Process が失敗して exit 1 になるが、それは正常なので無視する
      - cmd: powershell -NoProfile -Command "Get-Process {{.APP_NAME}} -ErrorAction SilentlyContinue | Stop-Process -Force"
        ignore_error: true
      - task: bump-version
      # CI でビルドしないので、バージョンやアプリ情報はここで反映してから exe に焼き込む
      - task: build-info
      - wails3 build
      # ビルドが通ってからコミットする
      - task: commit-build-info
      - task: tag-version
      - powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path '{{.DEPLOY_DEST}}' | Out-Null"
      - powershell -NoProfile -Command "Copy-Item -Path bin/* -Destination '{{.DEPLOY_DEST}}' -Recurse -Force"
      - task: copy-lib
      - echo "installed aibow $(< version) to {{.DEPLOY_DEST}}"

  build-info:
    desc: Propagate version and app info to the build assets.
    cmds:
      - task: sync-version
      - task: sync-lock
      # -name / -binaryname は config.yml から読まれず、省略すると空になる。Taskfile.yml の APP_NAME と一致させる
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config build/config.yml -dir build

  # version(唯一の正)を config.yml / package.json に反映する。
  # version.go のパスはリポジトリのルートからの相対パスなので、ルートで実行する
  sync-version:
    internal: true
    dir: ../..
    cmds:
      - go run _cmd/version.go

  # package-lock.json のバージョンを package.json にそろえる(node_modules には触らない)。
  # wails3 build は node_modules があると npm install しないので、ビルドではそろわない
  sync-lock:
    internal: true
    dir: frontend
    cmds:
      - npm install --package-lock-only --ignore-scripts --no-audit --no-fund

  # v+今のバージョンのタグがある(= デプロイ済みなのに version を上げていない)なら patch を上げる
  bump-version:
    internal: true
    dir: ../..
    cmds:
      - go run _cmd/version.go -auto

  # ビルド情報のファイルに変更があれば、それだけをコミットする。
  # パスを指定した git commit はそのファイルだけが対象なので、作業中の他の変更(ステージ済みも)は巻き込まない
  commit-build-info:
    internal: true
    cmds:
      - |
        if git diff --quiet HEAD -- {{.BUILD_INFO_FILES}}; then
          echo "build info: no changes"
        else
          git commit -m "chore: aibow $(< version) のビルド情報を反映する" -m "Glory to mankind." -- {{.BUILD_INFO_FILES}}
        fi

  # ビルドした HEAD に v+バージョンのタグを打つ。同じバージョンで再 deploy したときは、最初に打ったタグを動かさない
  tag-version:
    internal: true
    cmds:
      - |
        tag="v$(< version)"
        if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
          echo "tag $tag already exists at $(git rev-parse --short "$tag^{commit}")"
        else
          git tag "$tag" && echo "tagged $tag at $(git rev-parse --short HEAD)"
        fi

  # llama.cpp の DLL をインストール先の lib へコピーする(exe はカレントフォルダの lib を探すため)。
  # robocopy は変わったファイルだけをコピーする。終了コードは 0〜7 が成功、8 以上が失敗
  copy-lib:
    internal: true
    cmds:
      - powershell -NoProfile -Command 'robocopy "{{.LIB_SRC}}" "{{.DEPLOY_DEST}}/lib" /E /NFL /NDL /NJH /NJS /NP; if ($LASTEXITCODE -ge 8) { exit 1 }; exit 0'
