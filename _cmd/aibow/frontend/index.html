<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aibow</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1f2328; --muted: #6b7280;
    --border: #e3e1dc; --user: #e8f0fe; --accent: #2f6fde; --think: #fbf7e9;
    --code: #f1f1ef; --error: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --panel: #1f2023; --text: #e6e6e6; --muted: #9aa0a6;
      --border: #2e3034; --user: #1f2b44; --accent: #6ea0ff; --think: #2a2717;
      --code: #2a2b2f; --error: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #model { font-size: 12px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; }
  #modelSelect {
    font: inherit; font-size: 13px; padding: 4px 6px; border-radius: 6px; max-width: 320px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .note { align-self: center; font-size: 12px; color: var(--muted); padding: 2px 10px; }
  header .spacer { flex: 1; }
  button {
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }

  main { flex: 1; display: flex; min-height: 0; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; }
  #inner { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .msg { padding: 10px 14px; border-radius: 10px; line-height: 1.65; font-size: 14.5px; }
  .msg.user { background: var(--user); align-self: flex-end; max-width: 85%; white-space: pre-wrap; }
  .msg.assistant { background: var(--panel); border: 1px solid var(--border); }
  .msg.error { color: var(--error); border: 1px solid var(--error); background: transparent; }
  .msg .body p { margin: 0; white-space: pre-wrap; }
  .msg pre {
    background: var(--code); padding: 10px 12px; border-radius: 6px; overflow-x: auto;
    font-family: ui-monospace, Consolas, monospace; font-size: 13px; margin: 8px 0;
  }
  .thinking {
    background: var(--think); border-radius: 6px; padding: 6px 10px; margin-bottom: 8px;
    font-size: 12.5px; color: var(--muted);
  }
  .thinking summary { cursor: pointer; }
  .waiting { color: var(--muted); font-size: 13px; }
  .cutoff { color: var(--muted); font-style: italic; }
  .msg .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  aside label.check { display: flex; align-items: center; gap: 6px; color: var(--text); }
  aside code { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
  .thinking div { white-space: pre-wrap; margin-top: 6px; max-height: 240px; overflow-y: auto; }
  .stats { font-size: 11.5px; color: var(--muted); margin-top: 6px; font-family: ui-monospace, Consolas, monospace; }

  aside {
    width: 340px; border-left: 1px solid var(--border); background: var(--panel);
    padding: 14px; overflow-y: auto; font-size: 13px;
  }
  aside h2 { font-size: 13px; margin: 0 0 6px; }
  aside label { display: block; margin: 12px 0 4px; color: var(--muted); }
  aside textarea, aside input[type=range] { width: 100%; }
  aside textarea {
    font: inherit; font-size: 13px; padding: 6px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); resize: vertical;
  }
  #lastPrompt {
    background: var(--code); padding: 8px; border-radius: 6px; font-size: 11.5px;
    font-family: ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-all;
    max-height: 50vh; overflow-y: auto; margin: 6px 0 0;
  }
  .hint { color: var(--muted); font-size: 12px; line-height: 1.5; }

  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px; }
  #form { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  #input {
    flex: 1; font: inherit; font-size: 14.5px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    resize: none; min-height: 42px; max-height: 200px;
  }
  @media (max-width: 860px) { aside { display: none; } }
</style>
</head>
<body>
<header>
  <h1>aibow</h1>
  <select id="modelSelect" title="使うモデル(models フォルダと Ollama のモデル)"></select>
  <span id="model">…</span>
  <span class="spacer"></span>
  <button id="clearBtn" title="会話履歴を消す">新しい会話</button>
</header>

<main>
  <div id="chat"><div id="inner"></div></div>

  <aside>
    <h2>設定</h2>
    <label for="system">システムプロンプト</label>
    <textarea id="system" rows="4">あなたは親切なアシスタントです。日本語で簡潔に答えてください。</textarea>

    <label for="temp">temperature: <span id="tempVal">0.7</span></label>
    <input id="temp" type="range" min="0" max="1.5" step="0.1" value="0.7">
    <p class="hint">0 に近いほど毎回同じ答え、大きいほどランダムになります。</p>

    <label class="check"><input id="think" type="checkbox" checked> 思考する</label>
    <p class="hint">オフにすると、プロンプトの最後に空の思考 <code>&lt;think&gt;&lt;/think&gt;</code> を入れて、すぐ答えさせます。</p>

    <h2 style="margin-top:18px">モデルに渡した文字列</h2>
    <p class="hint">
      モデルは会話を覚えていません。送信のたびに、これまでの会話を全部この書式の1本の文字列にして読ませています。
      最後の <code>&lt;|im_start|&gt;assistant</code> の続きを書かせることで返事になります。
    </p>
    <pre id="lastPrompt">(まだ送信していません)</pre>
  </aside>
</main>

<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="メッセージを入力(Enterで送信 / Shift+Enterで改行)"></textarea>
    <button id="sendBtn" class="primary" type="submit">送信</button>
    <button id="stopBtn" type="button" disabled>停止</button>
  </form>
</footer>

<script type="module">
// ---- Go との橋渡し ---------------------------------------------------------
// /wails/runtime.js は Wails が配信している JavaScript(npm もビルドも不要)。
//   Call.ByName("main.ChatService.Xxx", ...) … Go のメソッドを呼ぶ。戻り値は Promise
//   Events.On("名前", ...)                    … Go から送られてくるイベントを受け取る
import { Call, CancelError, Events } from "/wails/runtime.js";

const service = "main.ChatService."; // service.go の ChatService(main パッケージ)
const callGo = (method, ...args) => Call.ByName(service + method, ...args);

// ---- 会話履歴 -------------------------------------------------------------
// これが「LLMの記憶」の正体。画面側でこの配列を持ち、毎回まるごと送る。
let history = [];
let controller = null;   // 生成中の呼び出し(stop() で停止できる)。生成中でなければ null
let chatListener = null; // 生成中の返事に chat イベントを渡す関数

// Go の Chat が送ってくる途中経過(service.go の ChatEvent)
Events.On("chat", e => chatListener && chatListener(e.data));

const $ = (id) => document.getElementById(id);
const inner = $("inner"), chat = $("chat"), input = $("input");

// ---- モデルの選択 ---------------------------------------------------------
// 一覧は models フォルダの GGUF と、Ollama が保存したモデル。
// 選ぶと aibow が今のモデルを解放して、新しいモデルを読み込む(数秒〜十数秒)。
let currentModel = null; // 今読み込まれているモデルの情報(Go の ModelInfo)
let hasGPU = false;

let startupLoading = false; // 起動時のモデルを Go が裏で読み込み中か
let startupDone = false;    // 起動時の読み込みが終わった合図(models イベント)を受け取ったか

async function loadModels() {
  const d = await callGo("Models");
  currentModel = d.current;
  hasGPU = d.gpu;

  const sel = $("modelSelect");
  sel.innerHTML = "";
  const groups = { file: "models フォルダ", ollama: "Ollama" };
  for (const [source, label] of Object.entries(groups)) {
    const items = d.models.filter(m => m.source === source);
    if (!items.length) continue;
    const g = document.createElement("optgroup");
    g.label = label;
    for (const m of items) g.appendChild(new Option(`${m.name}(${m.size_gb.toFixed(1)} GB)`, m.id));
    sel.appendChild(g);
  }
  // AIBOW_MODEL で一覧の外のファイルを指定した場合も、選択肢に出しておく
  if (currentModel && ![...sel.options].some(o => o.value === currentModel.id)) {
    sel.appendChild(new Option(currentModel.name, currentModel.id));
  }
  if (!currentModel) {
    const o = new Option("モデルを選んでください", "");
    o.disabled = true;
    sel.prepend(o);
  }
  sel.value = currentModel ? currentModel.id : "";
  showModelInfo();

  // 起動直後は Go がモデルを読み込んでいる最中のことがある。終わると models イベントが来る。
  if (d.loading && !startupLoading && !startupDone) {
    startupLoading = true;
    setBusy(true);
    $("stopBtn").disabled = true;
    $("model").textContent = "読み込み中…";
    addNote(`${d.loading} を読み込み中…`);
  }
}

function showModelInfo() {
  const c = currentModel;
  $("model").textContent = c
    ? `${c.params_b.toFixed(1)}B ・ ${hasGPU ? "GPU" : "CPU"} ・ コンテキスト ${c.n_ctx} ・ 読み込み ${c.load_sec.toFixed(1)}s`
    : "モデル未読み込み";
  $("model").title = c ? c.desc : "";
}

// 起動時のモデルの読み込みが終わった
// (Models の戻り値とイベントは別の経路で届くので、イベントが先に着いても大丈夫なようにしている)
Events.On("models", async () => {
  startupDone = true;
  const wasLoading = startupLoading;
  startupLoading = false;
  await loadModels();
  if (!wasLoading) return;
  addNote(currentModel
    ? `${currentModel.name} を読み込みました(${currentModel.load_sec.toFixed(1)} 秒)`
    : "モデルを読み込めませんでした。上で選び直してください");
  setBusy(false);
});

// ウィンドウに戻ってきたら一覧を作り直す(aibow を起動したまま ollama pull したときのため)
window.addEventListener("focus", () => {
  if (!controller && !startupLoading && !$("modelSelect").disabled) loadModels().catch(() => {});
});

$("modelSelect").addEventListener("change", async e => {
  const sel = e.target;
  const name = sel.options[sel.selectedIndex].text;
  sel.disabled = true;
  setBusy(true);
  $("stopBtn").disabled = true;
  $("model").textContent = "読み込み中…";
  addNote(`${name} を読み込み中…`);
  let failed = false;
  try {
    const info = await callGo("SwitchModel", sel.value); // 読み込み終わるまで返らない
    addNote(`モデルを ${info.name} に切り替えました(読み込み ${info.load_sec.toFixed(1)} 秒)`);
  } catch (err) {
    // Go が error を返すと、ここに来る。err.message が Go のエラーの文
    addMessage("error", err.message);
    failed = true;
  }
  await loadModels(); // 失敗したときは元のモデルの表示に戻る
  if (failed && currentModel) addNote(`元のモデル ${currentModel.name} に戻しました`);
  sel.disabled = false;
  setBusy(false);
});

loadModels().catch(err => {
  $("model").textContent = "モデル一覧を取得できません";
  addMessage("error", err.message);
});

$("temp").addEventListener("input", e => $("tempVal").textContent = e.target.value);

// ---- 表示まわり -----------------------------------------------------------
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ``` で囲まれた部分だけコードブロックにする簡易レンダラー
function render(text) {
  const parts = text.split("```");
  return parts.map((part, i) => {
    if (i % 2 === 1) {
      const code = part.replace(/^[^\n]*\n/, ""); // 1行目の言語名を落とす
      return `<pre><code>${escapeHtml(code)}</code></pre>`;
    }
    return part.trim() ? `<p>${escapeHtml(part.replace(/^\n+|\n+$/g, ""))}</p>` : "";
  }).join("");
}

// 会話の流れに、小さな区切りのメモを入れる(モデルの切り替えなど)
function addNote(text) {
  const el = document.createElement("div");
  el.className = "note";
  el.textContent = `— ${text} —`;
  inner.appendChild(el);
  scrollDown();
}

function addMessage(role, text = "") {
  const el = document.createElement("div");
  el.className = `msg ${role}`;
  if (role === "user" || role === "error") el.textContent = text;
  else el.innerHTML = `<div class="body"></div>`;
  inner.appendChild(el);
  scrollDown();
  return el;
}

// 答えが出ないまま終わったときに、答えの代わりに表示して履歴にも残す文
const NO_ANSWER = {
  length: "(考えている途中で上限トークン数に達したため、答えを出せませんでした)",
  context: "(考えている途中でコンテキストがいっぱいになったため、答えを出せませんでした)",
  cancel: "(考えている途中で停止されたため、答えを出していません)",
};

// 生成が「発言の終わり」以外の理由で止まったときの表示
const STOP_REASONS = {
  length: "上限トークン数で打ち切り",
  context: "コンテキストがいっぱいで打ち切り",
  cancel: "停止",
};

function secSince(t) {
  return Math.round((performance.now() - t) / 1000);
}

function scrollDown() {
  chat.scrollTop = chat.scrollHeight;
}

// ---- 送信 -----------------------------------------------------------------
async function send(text) {
  history.push({ role: "user", content: text });
  addMessage("user", text);

  // システムプロンプトは履歴の先頭に毎回付ける
  const system = $("system").value.trim();
  const messages = system ? [{ role: "system", content: system }, ...history] : [...history];
  const body = { messages, think: $("think").checked, temperature: parseFloat($("temp").value) };

  const el = addMessage("assistant");
  const bodyEl = el.querySelector(".body");
  let content = "", thinking = "", thinkEl = null, thinkStart = 0;
  let firstAt = null, serverStats = null;
  const modelName = currentModel ? currentModel.name : "(モデルなし)"; // どのモデルの返事か記録しておく
  bodyEl.innerHTML = `<p class="waiting">応答待ち…</p>`;
  const startAt = performance.now();

  setBusy(true);

  // 返事は Chat の戻り値ではなく、chat イベントで少しずつ届く。done が来たら終わり。
  let finish;
  const finished = new Promise(resolve => finish = resolve);
  chatListener = (data) => {
    if (data.type === "done") {
      finish();
      return;
    }
    if (data.type === "prompt") {
      $("lastPrompt").textContent = data.text; // モデルに実際に渡した文字列
      return;
    }
    if (data.type === "stats") {
      serverStats = data.stats;
      return;
    }
    if (data.type === "thinking" || data.type === "content") {
      if (firstAt === null) {
        firstAt = performance.now();
        bodyEl.innerHTML = ""; // 「応答待ち…」を消す
      }
    }
    if (data.type === "thinking") {
      // 思考は畳んだ状態で出し、クリックで開いたときだけ中身を見せる
      if (!thinkEl) {
        thinkEl = document.createElement("details");
        thinkEl.className = "thinking";
        thinkEl.innerHTML = `<summary>思考中…</summary><div></div>`;
        el.insertBefore(thinkEl, bodyEl);
        thinkStart = performance.now();
      }
      thinking += data.text;
      const box = thinkEl.querySelector("div");
      box.textContent = thinking;
      if (thinkEl.open) box.scrollTop = box.scrollHeight;
      if (!content) thinkEl.querySelector("summary").textContent = `思考中… ${secSince(thinkStart)}秒`;
    } else if (data.type === "content") {
      if (thinkEl && !content) {
        thinkEl.querySelector("summary").textContent = `思考の過程(${secSince(thinkStart)}秒)`;
      }
      content += data.text;
      bodyEl.innerHTML = render(content);
    } else if (data.type === "error") {
      addMessage("error", data.message);
    }
    scrollDown();
  };

  // Go の Chat を呼ぶ。戻り値の Promise の cancel() を呼ぶと、Go 側の ctx がキャンセルされる
  const call = callGo("Chat", body);
  controller = { stopped: false, stop() { this.stopped = true; call.cancel(); } };
  call.catch(err => {
    if (err instanceof CancelError) return; // 停止ボタン。done イベントは Go から届く
    // Go のメソッドを呼べなかった(done イベントは来ない)
    addMessage("error", `呼び出しエラー: ${err.message}`);
    finish();
  });
  await finished;
  chatListener = null;

  // 統計: 最初の文字が出るまでの時間と、Go から届いたトークン数・速度
  if (firstAt !== null) {
    const parts = [modelName, `初回応答 ${((firstAt - startAt) / 1000).toFixed(2)}s`];
    if (serverStats) {
      const s = serverStats;
      parts.push(`プロンプト ${s.prompt_tokens} tok(再利用 ${s.reused_tokens})${s.prompt_sec.toFixed(2)}s`);
      const rate = s.gen_sec > 0 ? (s.gen_tokens / s.gen_sec).toFixed(1) : "-";
      parts.push(`生成 ${s.gen_tokens} tok ・ ${rate} tok/s`);
      if (s.stop_reason !== "eos") parts.push(STOP_REASONS[s.stop_reason] || s.stop_reason);
    } else if (controller.stopped) {
      parts.push("停止");
    }
    const stats = document.createElement("div");
    stats.className = "stats";
    stats.textContent = parts.join(" ・ ");
    el.appendChild(stats);
  }

  if (firstAt === null) bodyEl.innerHTML = "";

  // 履歴に残すのは「答え」だけ。思考部分は次回以降は送らないのが一般的。
  if (content) {
    history.push({ role: "assistant", content });
  } else if (thinkEl) {
    // 考えている途中で終わり、答えが出なかった場合。
    // 何も残さないと、モデルからは「質問に返事をしていない」ように見えるので、
    // 何が起きたかを返事として履歴に残す。
    thinkEl.querySelector("summary").textContent = `思考の過程(${secSince(thinkStart)}秒)`;
    const reason = serverStats ? serverStats.stop_reason : (controller.stopped ? "cancel" : "");
    const note = NO_ANSWER[reason] || "(考えている途中で終わったため、答えを出せませんでした)";
    bodyEl.innerHTML = `<p class="cutoff">${escapeHtml(note)}</p>` +
      (reason === "cancel" ? "" : `<p class="hint">「思考する」をオフにするか、AIBOW_MAX_TOKENS / AIBOW_CTX を増やすと答えまで届きやすくなります。</p>`);
    history.push({ role: "assistant", content: note });
  } else {
    el.remove();
  }

  controller = null;
  setBusy(false);
  input.focus();
}

function setBusy(busy) {
  $("sendBtn").disabled = busy;
  $("stopBtn").disabled = !busy;
  $("modelSelect").disabled = busy; // 生成中はモデルを切り替えられない
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || controller) return;
  input.value = "";
  input.style.height = "";
  send(text);
});

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    $("form").requestSubmit();
  }
});
input.addEventListener("input", () => {
  input.style.height = "";
  input.style.height = Math.min(input.scrollHeight, 200) + "px";
});

$("stopBtn").addEventListener("click", () => controller && controller.stop());

$("clearBtn").addEventListener("click", () => {
  if (controller) controller.stop();
  history = [];
  inner.innerHTML = "";
  $("lastPrompt").textContent = "(まだ送信していません)";
  input.focus();
});

input.focus();
</script>
</body>
</html>
